name: Juling Windows Release Artifacts

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Version in package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: juling-windows-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_INCREMENTAL: 'false'
      CARGO_PROFILE_TEST_CODEGEN_UNITS: '256'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate source and version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node -e "const p=require('./package.json'),c=require('./src-tauri/tauri.conf.json');if(process.env.GITHUB_REPOSITORY!=='wu798998264-crypto/juling'||!/^\d+\.\d+\.\d+$/.test(process.env.EXPECTED_VERSION)||p.version!==process.env.EXPECTED_VERSION||c.version!==p.version||c.identifier!=='com.wu798998264.juling')throw Error('Unexpected release source');"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/host-build-cache
        with:
          target: windows
          cache-on-failure: 'true'
      - name: Install dependencies
        run: npm ci
      - name: Native client injection regressions
        run: node --test src-tauri/src/modules/codex_app_enhancements/*.test.cjs tests/codex_app_injection_dialog.test.cjs
      - name: Verify Windows fixture regressions first
        shell: bash
        run: |
          set -euo pipefail
          fixture_status=0
          for attempt in 1 2 3; do
            cargo test --locked -p juling --lib native_transport_exhausted_stream_open_budget_can_fail_over_but_never_replay_opaque_state -- --nocapture --test-threads=1 || fixture_status=$?
          done
          cargo test --locked -p juling --lib modules::codex_session_visibility:: -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::codex_session_usage::tests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::codex_thread_sync:: -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::codex_temp_login::tests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::config::tests::proxy_env_ -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::instance_storage_cleanup::tests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::process::codex_linux_layout_tests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::process::codex_windows_managed_launch_tests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::process::windows_passive_exec_scan_tests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::update_checker::local::tests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::codex_app_injection::usage::tests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::codex_app_injection::output_speed::tests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib http_transport_failover_excludes_only_this_request_but_real_status_marks_account -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib remote_gateway_preserves_client_scope_and_thread_but_strips_management_headers -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib unfinished_http_upload_still_times_out_without_reaching_account_selection -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib responses_first_response_skips_transport_keepalives -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib websocket_candidate_with_no_upstream_send_has_no_failure_or_attempt_budget -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib websocket_handshake_connection_failure_keeps_code_and_context -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib browser_previews_are_sandboxed_bounded_and_expire -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib https_subscription_rejects_untrusted_certificate_without_system_trust_changes -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::codex_proxy_desktop_router::tests::startup -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib resource_relocation_never_mistakes_transport_paths_or_encoded_keys_for_files -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib modules::chatgpt_plan::storage::tests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib concurrent_bindings_cannot_assign_one_source_or_one_grant_twice -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib initial_directory_recovery_and_later_changes_use_the_same_persistent_location -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib commands::codex::codex_quota_future_tests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib mixed_routing_update_restores_instance_store_when_speed_write_fails -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib native_proxy_cold_start_missing_store_accepts_concurrent_first_requests -- --nocapture --test-threads=1 || fixture_status=$?
          cargo test --locked -p juling --lib request_diagnostics_pull_bounds_total_body_time_and_cancels_closed_endpoint -- --nocapture --test-threads=1 || fixture_status=$?
          exit $fixture_status
      - name: Native Rust behavior regressions
        timeout-minutes: 90
        run: cargo test --locked -p juling --lib -- --nocapture --test-threads=1
      - name: Juling cooldown safety gate
        run: npm run test:juling-cooldown
      - name: Frozen protocol parity gate
        run: npm run test:codex-parity
      - name: Core Rust regressions
        run: npm run test:rust:core
      - name: Build signed Windows installers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          JULING_ANTIGRAVITY_GOOGLE_CLIENT_ID: ${{ secrets.JULING_ANTIGRAVITY_GOOGLE_CLIENT_ID }}
          JULING_ANTIGRAVITY_GOOGLE_CLIENT_SECRET: ${{ secrets.JULING_ANTIGRAVITY_GOOGLE_CLIENT_SECRET }}
          JULING_GEMINI_GOOGLE_CLIENT_ID: ${{ secrets.JULING_GEMINI_GOOGLE_CLIENT_ID }}
          JULING_GEMINI_GOOGLE_CLIENT_SECRET: ${{ secrets.JULING_GEMINI_GOOGLE_CLIENT_SECRET }}
        run: node scripts/tauri.cjs build --ci
      - name: Stage portable package and signed updater manifests
        shell: pwsh
        run: |
          @'
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path');
          const version=require('./package.json').version,out='release-assets';
          require('./scripts/release/stage_release_assets.cjs').stageReleaseAssets({platform:'windows',assetsDir:'target/release/bundle',outputDir:out});
          require('./scripts/release/build_windows_portable.cjs').buildWindowsPortableArchive({releaseDir:'target/release',outputDir:out,version});
          require('./scripts/release/build_target_latest_json.cjs').buildTargetManifests({version,repo:process.env.GITHUB_REPOSITORY,assetsDir:out,notesFile:`docs/releases/v${version}.md`,publishedAt:new Date().toISOString(),outputDir:out,targets:['windows-x86_64-nsis','windows-x86_64-msi']});
          require('./scripts/release/build_windows_latest_json.cjs').buildWindowsLatest(out);
          const expected=[`Juling_${version}_x64-setup.exe`,`Juling_${version}_x64-setup.exe.sig`,`Juling_${version}_x64_zh-CN.msi`,`Juling_${version}_x64_zh-CN.msi.sig`,`Juling_${version}_x64-portable.zip`,'latest-windows-x86_64-nsis.json','latest-windows-x86_64-msi.json','latest-windows-x86_64.json','latest.json'].sort();
          if(JSON.stringify(fs.readdirSync(out).sort())!==JSON.stringify(expected))throw Error('Incomplete or unexpected Windows assets');
          fs.writeFileSync(path.join(out,'SHA256SUMS.txt'),expected.map(n=>crypto.createHash('sha256').update(fs.readFileSync(path.join(out,n))).digest('hex')+'  '+n).join('\n')+'\n');
          console.log('Prepared signed installers, portable ZIP and updater manifests for '+version);
          '@ | node
      - name: Upload reviewable Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: Juling-Windows-${{ github.sha }}
          path: release-assets/*
          retention-days: 14
          if-no-files-found: error
