name: Juling macOS packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Juling source tag version to package
        required: true
        type: string
      source_run:
        description: Successful Build Matrix run for that release tag
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: juling-macos-packages-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    name: Package and verify ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            artifact: macos-aarch64
            runner: macos-15
          - arch: x64
            artifact: macos-x86_64
            runner: macos-15-intel
          - arch: universal
            artifact: macos-universal
            runner: macos-15
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_RUN: ${{ inputs.source_run }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      SOURCE_ARTIFACT: bundles-${{ matrix.artifact }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test packaging safeguards
        run: npm run test:release
      - name: Verify source run and safety gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/macos-artifact-package.cjs provenance
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          path: incoming
      - name: Verify, ad-hoc sign and package the original application
        run: node scripts/release/macos-artifact-package.cjs package
      # Signing secrets are available only after provenance and package checks.
      - name: Sign the finished updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npx tauri signer sign "release-assets/Juling_${PACKAGE_ARCH}.app.tar.gz"
      - name: Verify updater signature and checksums
        run: node scripts/release/macos-artifact-package.cjs finalize
      - name: Collect startup diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p .tmp/mac-diagnostics
          node -e 'const fs=require("node:fs"),cp=require("node:child_process");try{const r=cp.spawnSync("lldb",["--batch","-k","thread backtrace all","-o","run","-o","quit","--",".tmp/macos-payload/Juling.app/Contents/MacOS/Juling"],{encoding:"utf8",timeout:45000,maxBuffer:8*1024*1024});fs.writeFileSync(".tmp/macos-lldb.log",String(r.stdout)+String(r.stderr));}catch(e){fs.writeFileSync(".tmp/macos-lldb.log",e.message)}'
          cp .tmp/macos-*.log .tmp/mac-diagnostics/ 2>/dev/null || true
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name '聚灵*' -exec cp '{}' .tmp/mac-diagnostics/ \; 2>/dev/null || true
          sw_vers > .tmp/mac-diagnostics/host.txt
          uname -m >> .tmp/mac-diagnostics/host.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-diagnostics-${{ matrix.arch }}
          path: .tmp/mac-diagnostics/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: juling-macos-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
