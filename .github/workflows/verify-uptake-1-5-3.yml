name: Verify 1.5.3 integration
on:
  push:
    branches: [codex/juling-1-5-3-uptake]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_TEST_INCREMENTAL: 'false'
      CARGO_PROFILE_TEST_CODEGEN_UNITS: '256'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/host-build-cache
        with:
          target: windows
      - run: npm run test:juling-cooldown
      - run: npm run test:codex-parity
      - name: Check image batches and session usage
        shell: bash
        run: |
          set -euo pipefail
          for suite in codex_native_api::images::http_tests modules::codex_session_usage modules::antigravity_token_usage large_compression_tests t3code_privacy new_antigravity_model_tests chat_unknown_field_http_tests request_compat::tests codex_native_api::chat::tests apikey_fun_gemini_cli per_account_concurrency_overrides native_concurrency_permit_enforces_distinct; do
            cargo test --locked -p juling --lib "$suite" -- --test-threads=1 | tee suite.log
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' suite.log
          done
